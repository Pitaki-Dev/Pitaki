name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # L1 → public/foliate 同步（校验 view.js 的相对路径加载仍在，R11）
      - run: pnpm sync:foliate
      # L0 vendor 产物（含 zip.js 体积断言与 R13 入口守卫）
      - run: pnpm build:vendor
      - run: pnpm typecheck
      - run: pnpm build
